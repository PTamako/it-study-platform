name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for licensed language data generation
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/language-unlearned-filter'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install language data decompressor
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/language-unlearned-filter'
        run: python -m pip install --disable-pip-version-check zstandard==0.23.0

      - name: Generate 3,000 Japanese and 3,000 English learning cards
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/language-unlearned-filter'
        run: python scripts/generate_language_learning_seed.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run dictionary regression tests
        run: npm test

      - name: Type-check and build frontend
        run: npm run build

      - name: Validate local D1 migrations
        run: npx wrangler d1 migrations apply it-study-platform-db --local

      - name: Bundle Worker without publishing
        run: npx wrangler deploy --dry-run

      - name: Commit the generated, validated language-card migration
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'feat/language-unlearned-filter'
        run: |
          cp migrations/0079_language_learning_6000_cards.sql /tmp/0079_language_learning_6000_cards.sql
          git fetch origin feat/language-unlearned-filter
          git checkout -B feat/language-unlearned-filter origin/feat/language-unlearned-filter
          cp /tmp/0079_language_learning_6000_cards.sql migrations/0079_language_learning_6000_cards.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/0079_language_learning_6000_cards.sql
          if git diff --cached --quiet; then
            echo "Generated migration is already committed."
          else
            git commit -m "data: generate 6000 language cards"
            git push origin feat/language-unlearned-filter
          fi
