name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Python for licensed sentence dataset generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate attributed Japanese and English sentence migration
        run: python scripts/generate_language_sentence_seed.py

      - name: Run dictionary regression tests
        run: npm test

      - name: Type-check and build frontend
        run: npm run build

      - name: Validate local D1 migrations
        run: npx wrangler d1 migrations apply it-study-platform-db --local

      - name: Bundle Worker without publishing
        run: npx wrangler deploy --dry-run
