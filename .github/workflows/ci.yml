name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for licensed language data generation
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/language-unlearned-filter' && hashFiles('migrations/0079_language_learning_6000_cards.sql') == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install language data decompressor
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/language-unlearned-filter' && hashFiles('migrations/0079_language_learning_6000_cards.sql') == ''
        run: python -m pip install --disable-pip-version-check zstandard==0.23.0

      - name: Generate 3,000 Japanese and 3,000 English learning cards
        id: generate_language_data
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/language-unlearned-filter' && hashFiles('migrations/0079_language_learning_6000_cards.sql') == ''
        run: python scripts/generate_language_learning_seed.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run dictionary regression tests
        run: npm test

      - name: Type-check and build frontend
        run: npm run build

      - name: Validate local D1 migrations
        run: npx wrangler d1 migrations apply it-study-platform-db --local

      - name: Bundle Worker without publishing
        run: npx wrangler deploy --dry-run

      - name: Export generated migration through bounded log chunks
        if: success() && steps.generate_language_data.outcome == 'success' && github.event_name == 'pull_request' && github.head_ref == 'feat/language-unlearned-filter'
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          encoded = base64.b64encode(Path("migrations/0079_language_learning_6000_cards.sql").read_bytes()).decode("ascii")
          print("LANGUAGE_MIGRATION_BEGIN")
          for index in range(0, len(encoded), 30000):
              print(f"LANGUAGE_MIGRATION_B64_{index // 30000:04d}=" + encoded[index:index + 30000])
          print("LANGUAGE_MIGRATION_END")
          PY
