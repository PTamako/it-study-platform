# One-time audited release only for the review-validated PR #185.
# No Preview worker, D1, Pages environment or persistent extra deployment.
name: One-time Zhixue unified repair production release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zhixue-unified-repair-release-once-20261117.yml
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: zhixue-unified-repair-release-once
  cancel-in-progress: false
jobs:
  dispatch-reviewed-release:
    if: github.event.before == '5644be87b895b0fd70ee2aee3a140420c3beadf2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify this exact production merge came from PR 185
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          gh api "repos/$REPO/pulls/185" | jq -e --arg expected "$MERGED_SHA" \
            '.merged == true and .base.ref == "main" and .merge_commit_sha == $expected'
      - name: Invoke existing backup-first gated D1 migration and deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-cloudflare.yml -R "$REPO" --ref main \
            -f release_confirmation=FOUR_APP_RELEASE_APPROVED
