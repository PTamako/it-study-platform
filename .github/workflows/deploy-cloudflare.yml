name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Direct pushes are still possible until GitHub repository branch protection
      # is enabled by an owner. Keep those pushes from being deployed automatically.
      - name: Refuse production deployment for unreviewed direct pushes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.REPO}/commits/${process.env.SHA}/pulls`, {
            headers: {
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            },
          })
          if (!response.ok) throw new Error('Cannot verify merged PR origin: HTTP ' + response.status)
          const prs = await response.json()
          if (!Array.isArray(prs) || !prs.some(pr =>
            pr.merged_at && pr.base?.ref === 'main' && pr.merge_commit_sha === process.env.SHA)) {
            throw new Error('Production deployment blocked: main must be updated by a merged PR (or manual approved workflow dispatch).')
          }
          console.log('Verified merged PR origin for production commit.')
          NODE

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate reviewed FE A/B phase-one practice bank
        run: node scripts/generate_fe_growth_phase1.mjs

      - name: Smoke-test new FE practice corpus and migration immediately
        run: node --test scripts/fe-growth-phase1.test.mjs

      - name: Compile source-reviewed IPA 2019 spring FE morning questions
        run: node scripts/generate_fe_2019_spring_source_review.mjs

      - name: Validate IPA official answers and safe import before large dataset generation
        run: node --test scripts/fe-ipa-2019-reviewed.test.mjs

      - name: Generate IPA 2019 spring legacy FE morning 28-40 source-verified batch
        run: node scripts/generate_fe_2019_spring_am_28_40.mjs

      - name: Verify 2019 spring 28-40 IPA answer keys and safe import
        run: node --test scripts/fe-ipa-2019-am-28-40.test.mjs

      - name: Generate IPA 2019 spring FE morning 41-50 source-verified batch
        run: node scripts/generate_fe_2019_spring_am_41_50.mjs

      - name: Verify 2019 spring 41-50 IPA official answer keys and history safety
        run: node --test scripts/fe-ipa-2019-am-41-50.test.mjs

      - name: Generate IPA 2019 spring FE morning 51-60 source-verified batch
        run: node scripts/generate_fe_2019_spring_am_51_60.mjs

      - name: Verify 2019 spring 51-60 official answer keys, chart formulas and data safety
        run: node --test scripts/fe-ipa-2019-am-51-60.test.mjs

      - name: Generate IPA 2019 spring FE morning 61-70 source-verified batch
        run: node scripts/generate_fe_2019_spring_am_61_70.mjs

      - name: Verify 2019 spring 61-70 answer keys, complete ROI table and history safety
        run: node --test scripts/fe-ipa-2019-am-61-70.test.mjs

      - name: Prepare 2022 IPA official-sample training items without remote D1 reads
        run: node scripts/generate_fe_2022_official_samples.mjs

      - name: Validate 2022 IPA sample answers, kind filtering and additive import
        run: node --test scripts/fe-2022-official-samples.test.mjs

      - name: Generate remaining IPA 2022 sample A/B and April set locally
        run: node scripts/generate_fe_2022_official_samples_completion.mjs

      - name: Verify IPA 2020-2022 exemption catalog and all 86 samples
        run: node --test scripts/fe-2022-official-samples-completion.test.mjs scripts/fe-2020-2022-exemption-catalog.test.mjs

      - name: Generate FY2020–22 IPA FE exemption question bank with dedup links
        run: node scripts/generate_fe_2020_2022_exemption_first_batch.mjs

      - name: Validate exam-origin isolation, official answer keys and one-to-many occurrences
        run: node --test scripts/fe-exemption-official-first23.test.mjs

      - name: Build 2020-06-14 IPA exemption tree and flowchart adaptations
        run: node scripts/generate_fe_exemption_20200614_q07_q10.mjs

      - name: Verify 2020 Q7/Q10 official keys, visual semantics and data safety
        run: node --test scripts/fe-exemption-20200614-q07-q10.test.mjs

      - name: Generate IPA 2019 spring FE legacy AM 71-80 verified final batch
        run: node scripts/generate_fe_2019_spring_am_71_80.mjs

      - name: Verify official 2019 Q71-80 answers, fishbone and original opportunity-loss table
        run: node --test scripts/fe-ipa-2019-am-71-80.test.mjs

      - name: Set up Python for licensed sentence dataset generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Tatoeba source exports
        uses: actions/cache@v4
        with:
          path: /tmp/language-sentence-sources
          key: tatoeba-sentence-exports-v1-${{ runner.os }}

      - name: Generate attributed Japanese and English sentence migration
        run: python scripts/generate_language_sentence_seed.py

      - name: Compile offline learner lexicon from committed licensed seeds
        run: python scripts/build_static_learner_dictionary.py

      - name: Audit licensed dictionary and grammar quality offline (zero D1/AI)
        run: node scripts/audit-language-quality.mjs

      - name: Upload language quality report for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-quality-report
          path: quality-reports/language-quality.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate FE practice question migration
        run: node scripts/generate_fe_practice_bank.mjs


      - name: Run automated regression tests
        run: npm test

      - name: Generate immutable release version marker
        run: printf '{"version":"%s"}\n' "$GITHUB_SHA" > public/version.json

      - name: Type-check and build frontend
        env:
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build

      # Fail before any production D1 migration if Vite did not package static lessons.
      - name: Verify static lesson and dictionary assets included in dist (zero D1 reads)
        run: node scripts/check-static-assets.mjs --local

      # Fail closed before touching the remote database: apply the complete migration
      # chain to a fresh local D1 database, including the generated sentence corpus.
      - name: Validate complete D1 migration chain locally
        run: npx wrangler d1 migrations apply it-study-platform-db --local

      - name: Verify all question JSON and required texts in local D1
        run: npx wrangler d1 execute it-study-platform-db --local --json --command "$(cat scripts/question-integrity.sql)" | node scripts/check-question-json.mjs


      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository Actions secrets before deploying."
            exit 1
          fi

      # Apply reviewed, versioned schema changes before deploying code that depends on them.
      # D1 Time Travel is enabled automatically for production storage. Capture
      # a usable recovery bookmark *before* modifying schema; fail closed otherwise.
      - name: Capture production D1 pre-migration recovery bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p release-audit
          npx wrangler d1 time-travel info it-study-platform-db --json > release-audit/pre-migration-bookmark.json
          node -e "const fs=require('node:fs');const value=JSON.parse(fs.readFileSync('release-audit/pre-migration-bookmark.json','utf8'));if(!/[a-f0-9]{8}-[a-f0-9]{8}-[a-f0-9]{8}-[a-f0-9]{32}/i.test(JSON.stringify(value)))process.exit(1)"
      - name: Archive pre-migration recovery bookmark
        uses: actions/upload-artifact@v4
        with:
          name: d1-pre-migration-bookmark
          path: release-audit/pre-migration-bookmark.json
          retention-days: 7
          if-no-files-found: error

      - name: Apply reviewed D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply it-study-platform-db --remote

      # Fail closed if a migration was reported applied but a required personal
      # learning table/column is missing. LIMIT 0 validates schema only: zero
      # answer rows are fetched, and no user's data is written or displayed.
      - name: Verify production learning schema (read-only, zero data rows)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx wrangler d1 execute it-study-platform-db --remote --command "SELECT scene_id, answer_index FROM daily_listening_answers WHERE 0 LIMIT 0;"
          npx wrangler d1 execute it-study-platform-db --remote --command "SELECT question_id, answer_index FROM daily_grammar_answers WHERE 0 LIMIT 0;"
          npx wrangler d1 execute it-study-platform-db --remote --command "SELECT card_id, last_grade FROM language_card_reviews WHERE 0 LIMIT 0;"
          npx wrangler d1 execute it-study-platform-db --remote --command "SELECT question_id FROM study_attempts WHERE 0 LIMIT 0;"
          npx wrangler d1 execute it-study-platform-db --remote --command "SELECT term FROM saved_vocabulary_entries WHERE 0 LIMIT 0;"
          npx wrangler d1 execute it-study-platform-db --remote --command "SELECT language, term FROM saved_vocabulary_entries_v2 WHERE 0 LIMIT 0;"
          npx wrangler d1 execute it-study-platform-db --remote --command "SELECT word_key FROM daily_word_reviews WHERE 0 LIMIT 0;"

      - name: Verify production answer JSON before publishing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute it-study-platform-db --remote --json --command "$(cat scripts/question-integrity.sql)" | node scripts/check-question-json.mjs

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Wait for static asset propagation and reject SPA HTML for missing .json files.
      - name: Verify published static manifests and fingerprinted payloads (zero D1 reads)
        env:
          BASE_URL: https://it-study-platform.yupan6706.workers.dev
        run: node scripts/check-static-assets.mjs --deployed

      - name: Verify deployed service health
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "https://it-study-platform.yupan6706.workers.dev/api/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deployment completed but health endpoint did not return HTTP 200."
          exit 1

      - name: Verify unauthenticated access is denied for personal APIs
        env:
          BASE_URL: https://it-study-platform.yupan6706.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL
          // Derive protection smoke cases from the Worker rather than a stale
          // manually maintained list. Future endpoints become covered by default.
          const { readFileSync } = await import('node:fs')
          const worker = readFileSync('worker/index.ts', 'utf8')
          const protectedBlock = worker.match(/const protectedPersonalPaths = new Set\(\[([\s\S]*?)\]\)/)?.[1]
          const writeBlock = worker.match(/const isWriteEndpoint = \[([\s\S]*?)\]\.includes\(url\.pathname\)/)?.[1]
          if (!protectedBlock || !writeBlock) throw new Error('Could not discover protected endpoints from Worker')
          const paths = block => [...block.matchAll(/'\/api\/[^']+'/g)].map(m => m[0].slice(1, -1))
          const protectedReads = [...new Set(paths(protectedBlock))]
          const protectedWrites = [...new Set(paths(writeBlock))].map(path => ['POST', path])
          protectedWrites.push(['DELETE', '/api/exam-history'])
          for (const [, path] of protectedWrites) {
            if (!protectedReads.includes(path)) throw new Error('Write endpoint not protected: ' + path)
          }
          if (protectedReads.length < 25) throw new Error('Protected endpoint count unexpectedly decreased')
          for (const path of protectedReads) {
            const response = await fetch(new URL(path, base), { redirect: 'manual' })
            if (response.status !== 401) {
              throw new Error(`Unauthenticated GET ${path}: expected 401, got ${response.status}`)
            }
          }
          for (const [method, path] of protectedWrites) {
            const response = await fetch(new URL(path, base), {
              method,
              headers: { 'content-type': 'application/json' },
              body: method === 'DELETE' ? undefined : '{}',
              redirect: 'manual',
            })
            if (response.status !== 401) {
              throw new Error(`Unauthenticated ${method} ${path}: expected 401, got ${response.status}`)
            }
          }
          console.log(`Verified unauthenticated denial for ${protectedReads.length} personal reads and ${protectedWrites.length} personal writes/deletes.`)
          NODE

      - name: Verify published static bilingual sentence corpus without D1 reads
        env:
          BASE_URL: https://it-study-platform.yupan6706.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL
          const manifestResponse = await fetch(`${base}/language-cards/manifest.json`, { cache: 'no-cache' })
          if (!manifestResponse.ok) throw new Error('Static lesson manifest unavailable')
          const manifest = await manifestResponse.json()
          if (manifest.version !== 1) throw new Error('Unsupported static lesson manifest')
          async function verifyLanguage(language) {
            const assetPath = manifest[language]
            const expectedPrefix = '/language-cards/' + language + '.'
            if (typeof assetPath !== 'string' || !assetPath.startsWith(expectedPrefix) || !assetPath.endsWith('.json')) {
              throw new Error(language + ': Invalid static asset path')
            }
            const response = await fetch(base + assetPath)
            if (!response.ok) throw new Error(language + ': static asset unavailable HTTP ' + response.status)
            const payload = await response.json()
            if (!Array.isArray(payload.items)) throw new Error(`${language}: API did not return an items array`)
            const items = payload.items
            if (items.length !== 5000) throw new Error(`${language}: expected 5000 cards, got ${items.length}`)
            const categories = new Set()
            for (const card of items) {
              if (card.language !== language || card.content_type !== 'sentence') {
                throw new Error(`${language}: unexpected language/content type on ${card.id}`)
              }
              if (!['日常句子', '职场语言'].includes(card.category)) {
                throw new Error(`${language}: unexpected category ${card.category} on ${card.id}`)
              }
              categories.add(card.category)
              const highlights = JSON.parse(card.highlight_json || '[]')
              const vocabulary = JSON.parse(card.vocabulary_expansion_json || '[]')
              const grammar = JSON.parse(card.grammar_expansion_json || '[]')
              if (!highlights.some(hit => hit.type === 'vocabulary') || !highlights.some(hit => hit.type === 'grammar')) {
                throw new Error(`${language}: missing vocabulary or grammar highlight on ${card.id}`)
              }
              for (const hit of highlights) {
                const codepoints = [...card.term]
                if (codepoints.slice(hit.start, hit.end).join('') !== hit.term) {
                  throw new Error(`${language}: incorrect highlight offsets on ${card.id}`)
                }
                if (!hit.rule_id || !hit.confidence) throw new Error(`${language}: missing annotation trace on ${card.id}`)
                if (['句中重点表达', '句子结构观察点', '句尾活用／表达观察点'].includes(hit.meaning) ||
                    String(hit.explanation || '').includes('未识别到明确')) {
                  throw new Error(`${language}: generic placeholder annotation on ${card.id}`)
                }
              }
              const ordered = [...highlights].sort((a, b) => a.start - b.start)
              for (let i = 1; i < ordered.length; i++) {
                if (ordered[i - 1].end > ordered[i].start) {
                  throw new Error(`${language}: overlapping highlights on ${card.id}`)
                }
              }
              for (const [kind, expansion] of [['vocabulary', vocabulary], ['grammar', grammar]]) {
                const highlighted = new Set(highlights.filter(hit => hit.type === kind).map(hit => hit.term))
                const explained = new Set(expansion.map(entry => entry.term))
                if (!expansion.length || [...highlighted].some(term => !explained.has(term))) {
                  throw new Error(`${language}: missing ${kind} expansion on ${card.id}`)
                }
              }
            }
            if (categories.size !== 2) throw new Error(`${language}: expected both daily and workplace categories`)

            // Exact linguistic regression examples are asserted by the generator's unit tests.
            // Production corpus selection is source-driven, so a specific sentence is not guaranteed
            // to be among the 5,000 licensed records. Validate every returned production card above.
            console.log(`${language}: verified ${items.length} production cards; categories=${[...categories].join(', ')}`)
          }
          await Promise.all([verifyLanguage('ja'), verifyLanguage('en')])
          NODE
