# One-shot dispatch: only an approved merge of PR #191 can start production.
# Reuse the existing audited deployment pipeline instead of duplicating D1 gates.
name: One-time Zhixue PWA integrity production release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zhixue-pwa-integrity-release-once-20261118.yml
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: zhixue-pwa-integrity-release-once
  cancel-in-progress: false
jobs:
  dispatch-reviewed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exactly PR 191 merged into main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          gh api "repos/$REPO/pulls/191" | jq -e --arg expected "$MERGED_SHA" \
            '.merged == true and .base.ref == "main" and .merge_commit_sha == $expected'
      - name: Dispatch existing audited Cloudflare production release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-cloudflare.yml -R "$REPO" --ref main \
            -f release_confirmation=FOUR_APP_RELEASE_APPROVED
