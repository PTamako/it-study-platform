# One-time, PR-specific UI hotfix dispatcher. No long-lived auto-deploy rule.
# Existing deploy-cloudflare.yml still performs the full production checks.
name: One-time Zhixue HomeFlow UI restore release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zhixue-ui-restore-release-once.yml
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: zhixue-ui-hotfix-dispatch-once
  cancel-in-progress: false
jobs:
  dispatch-approved-release:
    if: github.event.before == '09c5ff9acb89cd150a16f2ee7f55182645195655'
    runs-on: ubuntu-latest
    steps:
      - name: Verify reviewed UI-only hotfix PR 180 was merged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_SHA: '09c5ff9acb89cd150a16f2ee7f55182645195655'
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/180" | jq -e --arg merge "$MERGED_SHA" \
            '.merged == true and .merge_commit_sha == $merge'
      - name: Dispatch existing full release workflow for this requested hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-cloudflare.yml -R "$REPO" --ref main \
            -f release_confirmation=FOUR_APP_RELEASE_APPROVED
