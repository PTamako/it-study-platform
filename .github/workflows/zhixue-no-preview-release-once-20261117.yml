# One-time dispatch after verified merge; use the existing audited release workflow.
name: One-time Zhixue permanent no-preview production release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zhixue-no-preview-release-once-20261117.yml
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: zhixue-no-preview-release-once
  cancel-in-progress: false
jobs:
  dispatch-reviewed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm exactly this reviewed PR was merged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          gh api "repos/$REPO/pulls/PR_NUMBER_PLACEHOLDER" | jq -e --arg expected "$MERGED_SHA" \
            '.merged == true and .base.ref == "main" and .merge_commit_sha == $expected'
      - name: Trigger existing verified production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-cloudflare.yml -R "$REPO" --ref main \
            -f release_confirmation=FOUR_APP_RELEASE_APPROVED
