name = "it-study-platform"
main = "worker/index.ts"
compatibility_date = "2026-10-22"

# 唯一主 Worker：前端静态资源与 API 共用该服务，避免 CLI 再创建 it-study-platform-api。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API 请求先交给 Worker，其他静态资源由 Cloudflare 直接托管。
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "it-study-platform-db"
database_id = "ed4ca935-5d00-4f38-b3c5-c0d53c5aad63"
migrations_dir = "migrations"

# Cloudflare-hosted translation fallback for explanation text.
[ai]
binding = "AI"

[vars]
APP_ENV = "production"
